version: 2.1

############################################################################

references:
   validate_release_prefix: &validate_release_prefix
      run:
         name: Validate release version prefix
         command: |
            RELEASE_PREFIX="${BUILD_RELEASE_NO:-10.1.0_GA_}"
            if [ -z "${BUILD_RELEASE_NO}" ]; then
              echo "BUILD_RELEASE_NO not provided; using default: ${RELEASE_PREFIX}"
            fi
            echo "$RELEASE_PREFIX" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || (echo "BUILD_RELEASE_NO must start with semantic version (example: 10.1.0_GA_)" && exit 1)
            echo "Using release prefix: $RELEASE_PREFIX"

   checkout_job_steps: &checkout_job_steps
      steps:
         - *validate_release_prefix
         - checkout:
             method: full
         - run:
            name: Checking out dependencies.
            command: |
               git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b ZCS-18921 --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
               git clone -b master --single-branch https://github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
               git clone -b develop --single-branch https://github.com/Zimbra/zm-mailbox.git ~/zm-mailbox
               git clone -b develop --single-branch https://github.com/Zimbra/zm-ajax.git ~/zm-admin-ajax
               git clone -b develop --single-branch https://github.com/Zimbra/zm-taglib.git ~/zm-taglib
               echo "BUILD_NO=$CIRCLE_BUILD_NUM" > config.build
               mkdir -p ~/.zcs-deps
         - persist_to_workspace:
            root: ..
            paths:
               - zm-admin-console
               - zm-pkg-tool
               - zm-zcs
               - zimbra-package-stub
               - zm-mailbox
               - zm-admin-ajax
               - zm-taglib
               - .zcs-deps

   build_job_steps: &build_job_steps
      steps:
         - *validate_release_prefix
         - attach_workspace:
            at: ..
         - run:
            name: Creating package build
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update
              sudo apt-get install -y ant-contrib rpm dpkg-dev fakeroot lsb-release debhelper build-essential
              cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar || true
              cd ../zm-taglib
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-mailbox
              sed -i 's/rev="latest.integration"/rev="local"/g' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml
              if grep -n 'latest\.integration' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present in zm-mailbox ivy files"
                grep -n 'latest\.integration' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml || true
                exit 1
              fi
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local-all
              for MODULE in zm-native zm-common zm-soap zm-client zm-store; do
                PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
                PUB_JAR="$(find "$PUB_DIR" -maxdepth 1 -type f -name '*.jar' ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
                if [ -n "$PUB_JAR" ] && [ -f "$PUB_JAR" ]; then
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-latest.integration.jar"
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-local.jar"
                  echo "Aliased $MODULE => $PUB_JAR"
                else
                  echo "ERROR: could not locate published jar for $MODULE in $PUB_DIR"
                  ls -la "$PUB_DIR" 2>/dev/null || true
                  exit 1
                fi
              done
              cd ../zm-admin-ajax
              find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec sed -i 's/rev="latest.integration"/rev="local"/g' {} +
              if find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec grep -nH 'latest\.integration' {} + >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present in zm-admin-ajax ivy files"
                find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec grep -nH 'latest\.integration' {} + || true
                exit 1
              fi
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local
              for MODULE in zm-admin-ajax zm-taglib; do
                PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
                PUB_JAR="$(find "$PUB_DIR" -maxdepth 1 -type f -name '*.jar' ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
                if [ -n "$PUB_JAR" ] && [ -f "$PUB_JAR" ]; then
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-latest.integration.jar"
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-local.jar"
                  echo "Aliased $MODULE => $PUB_JAR"
                else
                  echo "ERROR: could not locate published jar for $MODULE in $PUB_DIR"
                  ls -la "$PUB_DIR" 2>/dev/null || true
                  exit 1
                fi
              done
              cd ../zm-admin-console
              chmod +x pkg-builder.pl
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              # Force local revisions for Zimbra ivy deps to avoid latest.integration misses in CI.
              sed -i 's/rev="latest.integration"/rev="local"/g' ivy.xml
              sed -i 's/revision="latest.integration"/revision="local"/g' build.xml
              if grep -n 'latest\.integration' ivy.xml build.xml >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present after rewrite"
                grep -n 'latest\.integration' ivy.xml build.xml || true
                exit 1
              fi
              echo "Using local revisions in zm-admin-console:"
              grep -n 'org="zimbra"' ivy.xml || true
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean pkg
         - persist_to_workspace:
            root: ..
            paths:
               - .ivy2
               - .zcs-deps
               - zm-admin-console/build/dist

   publish_job_steps: &publish_job_steps
      steps:
         - *validate_release_prefix
         - attach_workspace:
            at: ..
         - run:
            name: Publish package artifacts to Nexus
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
              cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar || true
              cd ../zm-taglib
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-mailbox
              sed -i 's/rev="latest.integration"/rev="local"/g' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml
              if grep -n 'latest\.integration' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present in zm-mailbox ivy files"
                grep -n 'latest\.integration' client/ivy.xml soap/ivy.xml soap/ivy-tools.xml soap/ivy-soapdoclet.xml store/ivy.xml || true
                exit 1
              fi
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local-all
              for MODULE in zm-native zm-common zm-soap zm-client zm-store; do
                PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
                PUB_JAR="$(find "$PUB_DIR" -maxdepth 1 -type f -name '*.jar' ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
                if [ -n "$PUB_JAR" ] && [ -f "$PUB_JAR" ]; then
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-latest.integration.jar"
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-local.jar"
                  echo "Aliased $MODULE => $PUB_JAR"
                else
                  echo "ERROR: could not locate published jar for $MODULE in $PUB_DIR"
                  ls -la "$PUB_DIR" 2>/dev/null || true
                  exit 1
                fi
              done
              cd ../zm-admin-ajax
              find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec sed -i 's/rev="latest.integration"/rev="local"/g' {} +
              if find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec grep -nH 'latest\.integration' {} + >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present in zm-admin-ajax ivy files"
                find . -type f \( -name 'ivy.xml' -o -name 'ivy-*.xml' \) -exec grep -nH 'latest\.integration' {} + || true
                exit 1
              fi
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}" clean publish-local
              for MODULE in zm-admin-ajax zm-taglib; do
                PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
                PUB_JAR="$(find "$PUB_DIR" -maxdepth 1 -type f -name '*.jar' ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
                if [ -n "$PUB_JAR" ] && [ -f "$PUB_JAR" ]; then
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-latest.integration.jar"
                  cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-local.jar"
                  echo "Aliased $MODULE => $PUB_JAR"
                else
                  echo "ERROR: could not locate published jar for $MODULE in $PUB_DIR"
                  ls -la "$PUB_DIR" 2>/dev/null || true
                  exit 1
                fi
              done
              cd ../zm-admin-console
              : "${NEXUS_HOST:?NEXUS_HOST is required}"
              : "${NEXUS_REPO:?NEXUS_REPO is required}"
              : "${NEXUS_USER:?NEXUS_USER is required}"
              : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"
              # Force local revisions for Zimbra ivy deps to avoid latest.integration misses in CI.
              sed -i 's/rev="latest.integration"/rev="local"/g' ivy.xml
              sed -i 's/revision="latest.integration"/revision="local"/g' build.xml
              if grep -n 'latest\.integration' ivy.xml build.xml >/dev/null 2>&1; then
                echo "ERROR: latest.integration still present after rewrite"
                grep -n 'latest\.integration' ivy.xml build.xml || true
                exit 1
              fi
              echo "Using local revisions in zm-admin-console:"
              grep -n 'org="zimbra"' ivy.xml || true
              ROOT="build/dist"
              APT_REPO="${NEXUS_REPO}-apt"
              YUM_REPO="${NEXUS_REPO}-yum"
              MODULE_PATH="zimbra/zm-admin-console/${CIRCLE_SHA1:-develop}"
              RAW_BASE="$(printf '%s' "${NEXUS_BASE_URL:-$NEXUS_HOST}" | sed 's/#.*$//' | sed 's:/*$::')"
              API_BASE="$RAW_BASE/service/rest/v1/components"
              PACKAGE_FILES="$(find "$ROOT" -type f \( -name '*.deb' -o -name '*.rpm' \))"
              if [ -z "$PACKAGE_FILES" ]; then
                echo "No package artifacts found in $ROOT"
                exit 1
              fi
              package_list_file="$(mktemp)"
              printf '%s\n' "$PACKAGE_FILES" > "$package_list_file"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                rel="$(echo "$f" | sed "s|^$ROOT/||")"
                dir="$(dirname "$rel")"
                file_name="$(basename "$f")"
                body_file="$(mktemp)"
                header_file="$(mktemp)"
                case "$f" in
                  *.deb)
                    repo="$APT_REPO"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "apt.asset=@$f" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *.rpm)
                    repo="$YUM_REPO"
                    yum_dir="$MODULE_PATH/$dir"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "yum.directory=$yum_dir" -F "yum.asset=@$f" -F "yum.asset.filename=$file_name" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *)
                    rm -f "$body_file" "$header_file"
                    continue
                    ;;
                esac
                case "$http_code" in
                  2??)
                    echo "Upload successful: $file_name (HTTP $http_code)"
                    ;;
                  *)
                    echo "Upload failed for $f (HTTP $http_code)"
                    [ -s "$header_file" ] && sed -n '1,80p' "$header_file"
                    [ -s "$body_file" ] && sed -n '1,120p' "$body_file"
                    rm -f "$body_file" "$header_file"
                    exit 1
                    ;;
                esac
                rm -f "$body_file" "$header_file"
              done < "$package_list_file"
              rm -f "$package_list_file"

############################################################################

jobs:
   checkout:
      working_directory: ~/zm-admin-console
      shell: /bin/bash -eo pipefail
      environment:
         ANT_OPTS: -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build:
      working_directory: ~/zm-admin-console
      shell: /bin/bash -eo pipefail
      environment:
         ANT_OPTS: -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps

   publish:
      working_directory: ~/zm-admin-console
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      environment:
         ANT_OPTS: -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *publish_job_steps

############################################################################

workflows:
   version: 2
   main:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
            filters:
               branches:
                  only:
                    - develop
                    - publish-nexus-package-poc
         - build:
            context:
               - docker-dev-registry
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop
                    - publish-nexus-package-poc
         - publish:
            context:
               - docker-dev-registry
            requires:
               - build
            filters:
               branches:
                 only:
                   - develop
                   - publish-nexus-package-poc
